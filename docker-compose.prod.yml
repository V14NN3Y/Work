# Production overrides. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires a real .env (see .env.production.example) with production secrets, the real
# domain, and DOMAIN/API_DOMAIN set for Caddy. See DEPLOY.md for the full walkthrough.
services:
  postgres:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      APP_ENV: production
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  backend_uploads:
  caddy_data:
  caddy_config:
