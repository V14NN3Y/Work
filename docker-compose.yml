# Base config — common to dev and production. Dev-only settings (source bind-mounts, hot
# reload, node_modules cache) live in docker-compose.override.yml, auto-loaded by a plain
# `docker compose up` with no -f flags. Production explicitly runs with
# `-f docker-compose.yml -f docker-compose.prod.yml`, which does NOT auto-load the override
# file — see DEPLOY.md. Neither `backend` nor `frontend` declare a `volumes:` key here so
# that whichever override applies is the sole contributor for a given mount path (Compose
# concatenates list keys like `volumes` across files rather than replacing them, so the same
# path must never be declared in more than one loaded file).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      CORS_ORIGINS: ${CORS_ORIGINS}
      UPLOAD_DIR: ${UPLOAD_DIR}
    ports:
      # Bound to localhost only — in production a reverse proxy (docker-compose.prod.yml)
      # terminates TLS and reaches this over the Docker network by service name, not this
      # published port. Locally, 127.0.0.1 still resolves to "localhost" exactly as before.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL_INTERNAL: ${API_BASE_URL_INTERNAL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
      # Supabase migration (in progress) — SUPABASE_URL_INTERNAL is a local-Docker-only
      # escape hatch for server-side code (middleware/Route Handlers/SSR) running inside this
      # container, which can't reach the CLI's host-mapped 127.0.0.1:54321. Same fallback
      # pattern as API_BASE_URL_INTERNAL above. Production (Netlify) has no such split — every
      # context there uses NEXT_PUBLIC_SUPABASE_URL directly, since there's no Docker network
      # to route around.
      SUPABASE_URL_INTERNAL: ${SUPABASE_URL_INTERNAL:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  pgdata:
