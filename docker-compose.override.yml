# Dev-only overrides. Auto-loaded by `docker compose up` (no -f flags) — this is what running
# the project locally has always used. Ignored by production deploys, which pass explicit
# -f flags (docker-compose.yml + docker-compose.prod.yml only).
services:
  backend:
    volumes:
      - ./backend/app:/app/app:z
      - ./backend/uploads:/app/uploads:z

  frontend:
    environment:
      WATCHPACK_POLLING: "true"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    volumes:
      - ./frontend:/app:z
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

volumes:
  frontend_node_modules:
  frontend_next_cache:
